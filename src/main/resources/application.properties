spring.application.name=Grupo06

# PostgreSQL local por defecto. DB_URL, DB_USERNAME y DB_PASSWORD permiten cambiar de entorno.
# Crear y restaurar sgcivorp_local antes de iniciar. Hibernate solo valida el esquema.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/sgcivorp_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Documentación OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# API: origenes permitidos del frontend (separados por comas).
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
# Base64 de 32 bytes o mas. Vacio genera una clave temporal segura por arranque.
app.security.jwt-secret=${JWT_SECRET:}

# Datos de ubicacion y horario confirmados; pagos en demostracion hasta configurar titular y Yape.
app.tienda.demo=${TIENDA_DEMO:true}
app.tienda.titular=${TIENDA_TITULAR:Comercial Nova - DEMOSTRACION}
app.tienda.yape=${TIENDA_YAPE:DEMO - no transferir}
app.tienda.direccion=${TIENDA_DIRECCION:Asociaci\u00f3n de Vivienda La Planicie de la Era / Zona de La Era de Pando, Ate, Lima 15487. Referencia: Pista nueva-Santa Clara, al costado de Ceviche69.}
app.tienda.horario=${TIENDA_HORARIO:Lunes a sabado, de 8:00 a. m. a 8:00 p. m.}
app.tienda.mapa-url=${TIENDA_MAPA_URL:https://maps.app.goo.gl/fYfcULhRuRgEEYhZ7}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

spring.config.import=optional:file:./conexion-db.properties,optional:file:./configuracion-tienda.properties
