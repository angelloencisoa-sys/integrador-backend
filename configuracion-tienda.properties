# Configuracion compartida por iniciar-api.cmd e iniciar-panel.cmd.
# Los cambios se aplican al reiniciar ambos procesos. No cambia pedidos anteriores.
# Con demo=true no hay cobros reales. Las ventas D001 se excluyen de reportes financieros.
app.tienda.demo=${TIENDA_DEMO:true}
app.tienda.titular=${TIENDA_TITULAR:Comercial Nova - DEMOSTRACION}
app.tienda.yape=${TIENDA_YAPE:DEMO - no transferir}
app.tienda.direccion=${TIENDA_DIRECCION:Av. Los Olivos 123, Lima (direccion referencial)}
app.tienda.horario=${TIENDA_HORARIO:Lunes a sabado, 9:00 a 20:00 (horario referencial)}
# Para recibir pagos reales: coloque datos reales en las cinco propiedades,
# cambie demo a false, reinicie API y panel y compruebe el destinatario.
# La verificacion de Yape es manual: este proyecto no consulta ni cobra en Yape.
